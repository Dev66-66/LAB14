# Service lab14-dashboard — NodePort сервис для внешнего доступа к дашборду.
# Доступен на порту 30501 каждого узла кластера: http://<node-ip>:30501
apiVersion: v1
kind: Service
metadata:
  name: lab14-dashboard
  namespace: lab14
  labels:
    app: lab14-dashboard
spec:
  type: NodePort
  selector:
    app: lab14-dashboard
  ports:
    - name: streamlit
      port: 8501
      targetPort: 8501
      nodePort: 30501
      protocol: TCP
